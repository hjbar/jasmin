<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Effect Reflection</title>
    <style>
      body {
        background: black;
        margin: 0;
        padding: 20px;
      }
      .container {
        text-align: center;
      }
      .separator {
        border-top: 1px solid #aaa;
        margin-left: 200px;
        margin-right: 200px;
        height: 1px;
        margin-top: -4px;
      }
      #c2 {
        filter: url(#svgblur);
      }
    </style>
    <script src="main.js" defer></script>
</head>
<body>
    <svg height="0" style="position: absolute;">
      <filter id="svgblur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </svg>
    <div class="container">
      <video id="video"
             src="video.mp4"
             width="640"
             height="400"
             controls>
      </video>
        <div class="separator">
          <canvas id="c1" style="display: none;"></canvas>
          <canvas id="c2"></canvas>
        </div>
    </div>
</body>
</html>
