NAME="CHACHA20-OPT"
name="chacha20-opt"

NONCE="070000004041424344454647"
KEY="808182838485868788898a8b8c8d8e8f909192939495969798999a9b9c9d9e9f"

run_algorithm_tests() {
  local NB_REPEAT=$1

  run_benchmark $NB_REPEAT 59000000   "32" "$NONCE" "$KEY"
  run_benchmark $NB_REPEAT 15800000  "256" "$NONCE" "$KEY"
  run_benchmark $NB_REPEAT  2000000 "2048" "$NONCE" "$KEY"
}
