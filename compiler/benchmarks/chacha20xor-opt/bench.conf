NAME="CHACHA20XOR-OPT"
name="chacha20xor-opt"

MSG_01="2e942a20bd194ebf04d8eb0ed40e50ef87d18c4a447dfe5cda14c7937c2e8d07"

NONCE="070000004041424344454647"
KEY="808182838485868788898a8b8c8d8e8f909192939495969798999a9b9c9d9e9f"

run_algorithm_tests() {
  local NB_REPEAT=$1

  local MSG_02=$(generate_string 256)
  local MSG_03=$(generate_string 2048)

  run_benchmark   "32" "true" $NB_REPEAT 59330000 "$MSG_01" "$NONCE" "$KEY"
  run_benchmark  "256" "true" $NB_REPEAT  7900000 "$MSG_02" "$NONCE" "$KEY"
  run_benchmark "2048" "true" $NB_REPEAT   985000 "$MSG_03" "$NONCE" "$KEY"
}
